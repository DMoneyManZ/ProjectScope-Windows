<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">ProjectScope — Your crosshair. Your setup.</title>
  <desc id="desc">A precise mint crosshair on a midnight blue instrument field, beside ProjectScope typography.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#91b3c5" stroke-opacity=".08"/></pattern>
    <radialGradient id="field"><stop stop-color="#31576b"/><stop offset="1" stop-color="#1c3445"/></radialGradient>
  </defs>
  <rect width="1280" height="420" rx="24" fill="#1c3445"/>
  <path d="M830 0H1256Q1280 0 1280 24V396Q1280 420 1256 420H830Z" fill="url(#field)"/>
  <rect x="800" width="480" height="420" fill="url(#grid)"/>
  <g fill="none" stroke="#93ddc0">
    <circle cx="1040" cy="210" r="122" stroke-opacity=".2"/>
    <circle cx="1040" cy="210" r="82" stroke-opacity=".45"/>
    <path d="M1040 60V90m0 240v30M890 210h30m240 0h30" stroke-width="2" stroke-opacity=".45"/>
    <path d="M1040 135v48m0 54v48M965 210h48m54 0h48" stroke-width="8"/>
  </g>
  <circle cx="1040" cy="210" r="5" fill="#fff5d7"/>
  <g font-family="DejaVu Sans, sans-serif">
    <text x="68" y="151" fill="#f0f5f6" font-size="72" font-weight="700" letter-spacing="-3">ProjectScope</text>
    <text x="72" y="214" fill="#93ddc0" font-size="29">Your crosshair. Now on Windows.</text>
    <text x="72" y="267" fill="#bed0db" font-size="21">Shape it. Save it. Keep it on screen.</text>
    <path d="M72 307H705" stroke="#466273"/>
    <text x="72" y="352" fill="#d7e2e8" font-size="17">Native editor</text>
    <circle cx="235" cy="346" r="3" fill="#93ddc0"/>
    <text x="260" y="352" fill="#d7e2e8" font-size="17">30 presets</text>
    <circle cx="402" cy="346" r="3" fill="#93ddc0"/>
    <text x="427" y="352" fill="#d7e2e8" font-size="17">Windows desktop overlay</text>
  </g>
</svg>
