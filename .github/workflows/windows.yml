name: Private Windows preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows.yml'
      - 'projectscope/windows/**'
      - 'projectscope/profiles.py'
      - 'projectscope/storage.py'
      - 'projectscope/render.py'
      - 'presets/**'
      - 'assets/projectscope.svg'
      - 'windows/**'
      - 'tests/windows/**'
      - 'tests/test_profiles.py'
      - 'tests/test_storage.py'
      - 'docs/WINDOWS-*.md'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: windows-private-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-preview:
    # Never run the Windows build or upload its source/binaries in a public repo.
    if: github.event.repository.private == true && github.repository == 'DMoneyManZ/ProjectScope-Windows'
    permissions:
      contents: write
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install pinned build dependencies
        run: |
          python -m pip install -r windows/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
      - name: Portable profile and storage checks
        run: |
          python -m unittest discover -s tests -p test_profiles.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Profile tests failed' }
          python -m unittest discover -s tests -p test_storage.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Storage tests failed' }
      - name: Windows state, hotkey parser, and offscreen Qt checks
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import pathlib,unittest; loader=unittest.TestLoader(); suite=unittest.TestSuite(loader.discover('tests/windows',pattern=p.name) for p in sorted(pathlib.Path('tests/windows').glob('test_*.py')) if p.name != 'test_native.py'); result=unittest.TextTestRunner(verbosity=2).run(suite); raise SystemExit(not result.wasSuccessful())"
          if ($LASTEXITCODE -ne 0) { throw 'Windows unit tests failed' }
      - name: Native Windows hotkey checks in a fresh process
        run: |
          Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          python -m unittest discover -s tests/windows -p test_native.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows tests failed' }
      - name: Build and test the frozen Windows application
        run: ./windows/build.ps1 -SkipDependencyInstall
      - name: Save private packages and validation to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Tag = "windows-build-${{ github.run_id }}"
          $Notes = "Private tested Windows build from commit ${{ github.sha }}. Build and validation: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
          Compress-Archive -Path windows-artifacts/validation/* -DestinationPath windows-artifacts/Windows-validation.zip
          gh release create $Tag --repo "${{ github.repository }}" --target "${{ github.sha }}" --draft --prerelease --title "Windows preview build ${{ github.run_id }}" --notes $Notes
          if ($LASTEXITCODE -ne 0) { throw 'Could not create private draft release' }
          $Assets = @(Get-ChildItem windows-artifacts -File | ForEach-Object { $_.FullName })
          gh release upload $Tag @Assets --repo "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload private release assets' }
